name: Qiskit Runtime Cloud Integration

# Daily integration test against real IBM Cloud Qiskit Runtime -- never
# submits a job to a QPU's queue (qiskit-runtime/run_circuit.py only reads a
# real backend's calibration snapshot via AerSimulator.from_backend() and
# executes locally; IBM retired cloud-hosted simulator backends on
# 2024-05-15, so there is no cloud simulator left to submit to either).
# Scheduled + manual only, same pattern as upstream Qiskit/qiskit-ibm-runtime's
# own integration-tests.yml, to keep cloud usage bounded and predictable
# rather than running on every push. Gated to this repo's owner so the
# secrets below are never evaluated on a fork. See CLAUDE.md's
# "Added: CI/CD (Qiskit Runtime integration)" section.
on:
  schedule:
    - cron: '0 6 * * *'  # daily, 06:00 UTC
  workflow_dispatch:

jobs:
  cloud-integration-test:
    if: github.repository_owner == 'dreads'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r qiskit-runtime/requirements.txt
      - run: make -C qiskit-runtime integration-test
        env:
          QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
          QISKIT_IBM_INSTANCE: ${{ secrets.QISKIT_IBM_INSTANCE }}

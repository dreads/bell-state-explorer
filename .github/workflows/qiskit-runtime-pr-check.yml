name: Qiskit Runtime PR Check

# Local-simulator-only smoke test for the qiskit-runtime/ Bell-state circuit.
# References no secrets at all (see qiskit-runtime/run_circuit.py's mode
# selection), so it's safe to run on every PR, including ones from forks.
# Intended to be added as a required status check under
# Settings -> Branches -> branch protection for main -- see CLAUDE.md's
# "Added: CI/CD (Qiskit Runtime integration)" section.
on:
  pull_request:

jobs:
  local-sim-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r qiskit-runtime/requirements.txt
      - run: make -C qiskit-runtime integration-test
